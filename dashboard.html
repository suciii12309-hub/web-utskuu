<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<nav class="navbar navbar-expand-lg">
<div class="container">
<a class="navbar-brand text-white">RS Sehat</a>
<div class="ms-auto">
<a href="index.html">Home</a>
<a href="dokter.html">Dokter</a>
<a href="about.html">About</a>
<a href="login.html">Login</a>
</div>
</div>
</nav>
</header>

<div class="container container-box mt-5">

<h2 class="text-center mb-4">Data Pasien</h2>

<table class="table table-bordered text-center" id="tabel">
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>Umur</th>
<th>Keluhan</th>
<th>Aksi</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h4 class="mt-4">Form Pasien</h4>

<input id="nama" class="form-control mb-2" placeholder="Nama">
<input id="umur" class="form-control mb-2" placeholder="Umur">
<input id="keluhan" class="form-control mb-3" placeholder="Keluhan">

<div class="d-flex gap-2">
<button onclick="tambah()" class="btn-yellow">Simpan</button>
<button onclick="update()" class="btn-yellow">Update</button>
</div>

</div>

<footer>© 2026 RS Sehat</footer>

<script>
let data = [
    {nama:"Budi", umur:22, keluhan:"Flu"},
    {nama:"Siti", umur:30, keluhan:"Batuk"}
];

let editIndex = -1;

function tampil(){
    let tbody = document.querySelector("#tabel tbody");
    tbody.innerHTML="";
    data.forEach((d,i)=>{
        tbody.innerHTML += `
        <tr>
            <td>${i+1}</td>
            <td>${d.nama}</td>
            <td>${d.umur}</td>
            <td>${d.keluhan}</td>
            <td>
                <button onclick="edit(${i})" class="btn btn-warning btn-sm">Edit</button>
                <button onclick="hapus(${i})" class="btn btn-danger btn-sm">Hapus</button>
            </td>
        </tr>`;
    });
}

function tambah(){
    let nama = document.getElementById("nama").value;
    let umur = document.getElementById("umur").value;
    let keluhan = document.getElementById("keluhan").value;

    data.push({nama, umur, keluhan});
    tampil();
}

function edit(i){
    let d = data[i];
    document.getElementById("nama").value = d.nama;
    document.getElementById("umur").value = d.umur;
    document.getElementById("keluhan").value = d.keluhan;
    editIndex = i;
}

function update(){
    if(editIndex === -1) return;
    data[editIndex] = {
        nama: document.getElementById("nama").value,
        umur: document.getElementById("umur").value,
        keluhan: document.getElementById("keluhan").value
    };
    editIndex = -1;
    tampil();
}

function hapus(i){
    data.splice(i,1);
    tampil();
}

tampil();
</script>

</body>
</html>
